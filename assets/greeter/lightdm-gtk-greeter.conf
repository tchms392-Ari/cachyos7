# CachyOS 7 login screen (written by scripts/login-setup.sh; original saved as .bak-cachyos7)
[greeter]
background=/usr/share/backgrounds/cachyos7/cachyos7-login.jpg
user-background=false
theme-name=CachyOS-7-Greeter
icon-theme-name=CachyOS-7
cursor-theme-name=Win7OS-cursors
cursor-theme-size=24
font-name=Open Sans 11
xft-antialias=true
xft-dpi=96
xft-hintstyle=hintslight
xft-rgba=none
indicators=~host;~spacer;~clock;~spacer;~session;~a11y;~power
clock-format=%-I:%M %p   %A, %B %-d, %Y
position=50%,center 50%,center
default-user-image=#avatar-default
hide-user-image=false
round-user-image=false
panel-position=top
screensaver-timeout=0
